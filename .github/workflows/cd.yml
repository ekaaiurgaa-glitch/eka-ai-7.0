name: CD

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment"
        # Add your staging deployment commands here
        # kubectl set image deployment/eka-ai app=ghcr.io/${{ github.repository }}:${{ github.ref_name }} -n staging

  smoke-test-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Run smoke tests
      run: |
        pip install requests
        python -c "
        import requests
        import sys
        
        BASE_URL = 'https://staging-api.eka-ai.com'
        
        # Test root endpoint
        r = requests.get(f'{BASE_URL}/')
        assert r.status_code == 200, f'Root failed: {r.status_code}'
        print('✅ Root endpoint OK')
        
        # Test chat examples
        r = requests.get(f'{BASE_URL}/api/v1/chat/examples')
        assert r.status_code == 200, f'Chat examples failed: {r.status_code}'
        print('✅ Chat examples OK')
        
        print('All smoke tests passed!')
        "

  deploy-production:
    needs: smoke-test-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Deploy to production
      run: |
        echo "Deploying to production environment"
        # Add your production deployment commands here
        # kubectl set image deployment/eka-ai app=ghcr.io/${{ github.repository }}:${{ github.ref_name }} -n production
